<body>
<h1 align=center>T1A04 CSS</h1><br><br>

CSS is properly done with a .css file to tell the website the css it needs, but a style tag will do what you need it to as well.<br>

This is typical in document style
<style>
  b {
  color: #00ff00;
  }
</style><br>

  <i >This is writing with italics</i><br>

<i id="myB1" style="color:#00ff00; background-color:blue; "> This is italic with text colour and background colour.</i><br>

<input type=button value=Change onclick="{
  document.getElementById('myB1').style.color = 'red'
  document.getElementById('myB1').style.backgroundColor = 'yellow'
}"> <br><br>

<textarea id="myText" style=" background-image: url('myWhale.jpg'); position:relative; left:0; top:0; width:200; height:50; color:#ffffff; ">
</textarea><br>

<input type=button value=Move onclick="{
  document.getElementById('myText').style.left = '10px'
}">

<br><br><br><br>

<img src="myWhale.jpg" width=200 style=" border-radius:200px">

</body>
