<h1 align=center>T1A10 Events</h1>

Events are HTML code that activates Javascript code. Here are some examples:

<input type=text id="myText01" value="3"><br>

<input type=button value="Example onClick" onClick="{
    document.getElementById('myDiv01').innerHTML = 
  document.getElementById('myText01').value
  }">

<div id="myDiv01">Hover over me!</div>

<b id="myB02" onMouseOut="{
  document.getElementById('myB02').innerHTML = 'This is nice.'
  }" onMouseOver = "{
    document.getElementById('myB02').innerHTML = 'This is cool.'
  }"> This is bold</b> <br><br>

<h2>My own events</h2>

<div id="myPressW">Press W</div>

<div id="myClickTest">Click the button below me!</div>

<input type=button value="Update the div above me!" id="myButton01" onClick="{
    document.getElementById('myClickTest').innerHTML = 'Now try double clicking!'
    }"
    ondblClick="{
    document.getElementById('myClickTest').innerHTML = 'That was a double click!'
    }">

<input type="text" value="Dont you change this..." onChange="{
    document.getElementById('myPressW').innerHTML = 'hey you just changed the text I told you not to! >:('
    }">

//onBlur - not sure yet

<body onKeyPress="{
    if (event.key == 'w') {
        document.getElementById('myPressW').innerHTML = 'You Pressed W!'
    }
}">

<body onMouseMove="{
    document.getElementById('myClickTest').innerHTML = 'For all that mouse moving your not clicking the button...'
    }">
