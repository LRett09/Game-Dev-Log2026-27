<h1 align=center>T1A12 Objects</h1>

<script>
  let myPerson = {
    'age' = 1000
  }
</script>

Objects are stored named variables

<h2>Example working Objects code:</h2>
<input type=text id="myText01" value="Set the mood"><br>

<input type=button value="change age" onClick="{
  myPerson.age--
  }"><br><br>

<input type=button id="myButton01" value="Example Object Set and Show" onClick="{

    myPerson.firstName : 'Logan',
    myPerson.lastName :  'the Awesome',
    myPerson.eyeColour : 'blue',
    myPerson.mood : document.getElementById('myText01').value

    document.getElementById('myDiv01').innerHTML = '<br>myPerson Object has properties: <br>'
    document.getElementById('myDiv01').innerHTML += 'firstName: ' + myPerson.firstName + '<br>'
    document.getElementById('myDiv01').innerHTML += 'lastName: '  + myPerson.lastName + '<br>'
    document.getElementById('myDiv01').innerHTML += 'age: '       + myPerson.age + '<br>'
    document.getElementById('myDiv01').innerHTML += 'eyeColour: ' + myPerson.eyeColour + '<br>'
    document.getElementById('myDiv01').innerHTML += 'mood: ' + myPerson.mood + '<br>'

    }">

<div id="myDiv01">...</div>
