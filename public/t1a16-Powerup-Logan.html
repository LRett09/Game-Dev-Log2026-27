<h1>T1A16 Power Up</h1>

<script>

  let myHero  {
    name = "Captain Code"
    power = 100
    comment = "Ready to Train!"
  }
  
  function deadHero() {
    alert = "You lost!"
    myHero.power = 100
  }
    
</script>

<input type=button value="Train the hero!" onClick="{
  myHero.power = -10
  if (myHero.power > 50) { myHero.comment = 'Trained! Feeling Good!' } else
     (myHero.power =< 50 && > 20) { myHero.comment = 'Trained! Slowing down...' } else
     (myHero.power =< 20 && > 0) { myHero.comment = 'Trained! Getting Exhausted.' } else
     (myHero.power =< 0) { deadHero() }
  document.getElementById('myDiv01').innerHTML = myHero.comment + '<br>' + 'The hero has ' + myHero.power + ' power left!'
  }"><br><br>

<div id="myDiv01">Press the button to train your hero!</div>
