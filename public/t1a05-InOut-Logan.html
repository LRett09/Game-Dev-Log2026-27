<h3> Example Working Code</h3>

<input id="myNum01" type=number value="4" ><br>

<input type=button value="myEvent squares" onclick="{
  let myIn01 = parseFloat(document.getElementById('myNum01').value)
  let myAnswer = myIn01 * myIn01
  document.getElementById('myDiv01').innerHTML = myIn01 + ' sqaured = ' + myAnswer
  }"><br>

<input type=button value="myEvent doubles" onclick="{
  let myIn01 = parseFloat(document.getElementById('myNum01').value)
  let myAnswer = myIn01 + myIn01
  document.getElementById('myDiv01').innerHTML = myIn01 + ' doubled = ' + myAnswer
  }"><br>

  <div id="myDiv01">Waiting for input...</div>
