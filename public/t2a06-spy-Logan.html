<h1 align=center>T2A21 Spy</h1>
<textarea id="myArea01" rows=4 cols=70>Hello how are you</textarea><br>

<input type=button value="encrypt" onclick="encryptLetters()">
<input type=button value="encrypt to numbers" onclick="encryptNumbers()"><br><br>

<textarea id="myArea02" rows=4 cols=70></textarea><br><br>

<input type=button value="decrypt" onclick="decrypt()">
<input type=button value="decrypt numbers" onclick="decryptNumbers()"><br><br>

<textarea id="myArea03" rows=4 cols=70></textarea>

<script>

let alphabet = 'abcdefghijklmnopqrstuvwxyz'

function encryptLetters() {
   let myString = document.getElementById('myArea01').value.toLowerCase().split('')

   for (let myLoop = 0; myLoop < myString.length; myLoop++) {
      let position = alphabet.indexOf(myString[myLoop])

      if (myString[myLoop] == ' ') {
         myString[myLoop] = '0'
      } else if (position != -1) {
         myString[myLoop] = alphabet[(position + 1) % 26]
      }
   }
   document.getElementById('myArea02').value = myString.join('')
}

function encryptNumbers() {
   let myString = document.getElementById('myArea01').value.toLowerCase().split('')

   for (let myLoop = 0; myLoop < myString.length; myLoop++) {
      let position = alphabet.indexOf(myString[myLoop])

      if (myString[myLoop] == ' ') {
         myString[myLoop] = '0' 
      } else if (position != -1) {
         myString[myLoop] = String(position + 1)
      }
   }
   document.getElementById('myArea02').value = myString.join(' ')
}

function decrypt() {
   let secret = document.getElementById('myArea02').value.toLowerCase()
   let result = ''

   if (/[a-z]/.test(secret)) {
      let myString = secret.split('')
      for (let myLoop = 0; myLoop < myString.length; myLoop++) {
         let position = alphabet.indexOf(myString[myLoop])

         if (myString[myLoop] == '0') {
            myString[myLoop] = ' '
         } else if (position != -1) {
            myString[myLoop] = alphabet[(position + 25) % 26]
         }
      }
      result = myString.join('')
   }
   document.getElementById('myArea03').value = result
}
   function decryptNumbers() {

      let secret = document.getElementById('myArea02').value
      let result = ''
      
      let myString = secret.split(' ')
      for (let myLoop = 0; myLoop < myString.length; myLoop++) {
         let number = Number(myString[myLoop])

         if (myString[myLoop] == '0') {
            myString[myLoop] = ' '
         } else if (myString[myLoop] != '' && number >= 1 && number <= 26) {
            myString[myLoop] = alphabet[number - 1]
      }
      result = myString.join('')
   }

   document.getElementById('myArea03').value = result
}

</script>
