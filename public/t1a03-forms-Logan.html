<h1 align=center>T1A03 Forms</h1>
<h3><font color=green> Look look! Funny forms! </font></h3><br>

All of these are form elements: <br><br>

<font color=red> This counts as a form... </font><font color=blue> making you colorful! </font><br>

<input 
  type="range"
  step="5"
/><br>

<input 
  type="time"
  min="00:00:00"
  max="24:59:59"
  /><br>

<select>
  <option value="I am very cool" myCool="1">I am cool!</option>
  <option value="I am not very cool">I am not cool!</option>
</select><br>

<input
  type="button"
  value="click"
  onclick=myCool()
/>

<script>
function myCool() {
 if (myCool="1") {alert('you are not cool')} else {alert('you are very cool')}
 }
</script>
