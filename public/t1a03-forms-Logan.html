<h1 align=center>T1A03 Forms</h1>
<h3><font color=green> Look look! Funny forms! </font></h3><br>

All of these are form elements: <br><br>

<font color=red> This counts as a form... </font><font color=blue> making you colorful! </font><br>

<input 
  type="range"
  step="5"
/><br>

<input 
  type="time"
  min="00:00:00"
  max="24:59:59"
  /><br><br>

<select id="coolSelect">
  <option value="1">I am cool!</option>
  <option value="2">I am not cool!</option>
</select>

<input
  type="button"
  value="click"
  onclick=checkCool()
/><br><br>

<input id="myTextBox" style="background-color:#000000; color:#ffffff"> 

<input
  type="button"
  value="search"
  onclick=mySearch()
  /><br>

<div id="myOutput">Nothing yet!</div>

<script>
function checkCool() {
  var choice = document.getElementById("coolSelect").value;
  if (choice == "1") {alert('you are not cool')} else {alert('you are very cool!')}
}

function mySearch() {
  var text = document.getElementById("myTextBox").value;
  if (text === "Logan") {document.getElementById('myOutput').innerHTML = 'You found the Password!'} else {document.getElementById('myOutput').innerHTML = 'The password is Logan'}
}
  
</script><br><br>
