<h1 align=center>T1A05 Sort</h1>

<script>
  let myMax = 50
  let myCards = new Array(myMax)

  function myShow() { 
      let myTemp = ' '
  for ( let myLoop = 0; myLoop < myMax; myLoop++){
    myTemp += myLoop + ' = '+ myCards[myLoop] + '<br>'
  }
  document.getElementById('myDiv01').innerHTML = myTemp
  }
  
</script>

<input type=button value="set Random" onClick="{
  for ( let myLoop = 0; myLoop < myMax; myLoop++){
    myCards[myLoop] = Math.floor(Math.random()*10000)
  }
  myShow()
  }">

<input type=button value="Sort" onclick="{
  for (let i = 0; i < myMax - 1; i++) {
    for (let j = 0; j < myMax - 1 - i; j++) {
      if (myCards[j] > myCards[j + 1]) {
        let myTemp = myCards[j];
        myCards[j] = myCards[j + 1];
        myCards[j + 1] = myTemp;
      }
    }
  }
  myShow()
  }">

<input type=button value="De-Sort" onclick="{
  for (let i = 0; i < myMax - 1; i++) {
    for (let j = 0; j < myMax - 1 - i; j++) {
      if (myCards[j] < myCards[j + 1]) {
        let myTemp = myCards[j];
        myCards[j] = myCards[j + 1];
        myCards[j + 1] = myTemp;
      }
    }
  }
  myShow()
}">
  
<div id=myDiv01>...</div>
