<h1 align=center>T2A07 Canvas</h1>
Click the button to draw shapes :O<br>

<input type=button value="Draw basic shapes" onclick="{ myDrawShapes() }">

  <input type=button value="rotate canvas?" onclick="{
   myRotate = !myRotate
   myDrawShapes()
  }"><br><br>

<!--Smaller canvas so everything fits on 3/4 of a page -->
<canvas id="myCanvas" width="1000" height="1000" style="border:1px solid #000000;"></canvas>

  <script>
    //Set up global variables
    let myCanvas = document.getElementById('myCanvas')
    let myContext = myCanvas.getContext('2d')
    let myRotate = true
    
    //Drawing the shapes
    function myDrawShapes() {
  //Clear the canvas first
  myContext.clearRect(0, 0, myCanvas.width, myCanvas.height);
  
//rotate canvas around it's center
  if (myRotate == false) {
    myContext.translate(500, 500)
    myContext.rotate(Math.PI / 4)
    myContext.translate(-500, -500)
  }

  //Draw a simple line
  myContext.beginPath();
  myContext.linewidth = 3;
  myContext.strokeStyle = 'black';
  myContext.moveTo(500, 500);  //Start point (x, y)
  myContext.lineTo(450, 500);  //End point (x, y)
  myContext.stroke();

  //Draw a solid rectangle
  myContext.fillStyle = 'blue';
  myContext.fillRect(600, 750, 100, 60);  //(x, y, width, height

  //Draw a circle
  myContext.beginPath();
  myContext.lineWidth = 5;
  myContext.strokeStyle = 'green';
  myContext.arc(220, 600, 40, 0, 2 * Math.PI);  //(x, y, radius, start, end)
  myContext.stroke();

  //Write some text
  myContext.fillStyle = 'red';
  myContext.font = '24px Arial';
  myContext.fillText('You lied. Canvas is not fun. Im in pain', 400, 180);  //('text', x, y)

  //Draw a solid dimond
  myContext.rotate(45);
  myContext.fillStyle = 'purple';
  myContext.fillRect(300, 500, 60, 60);  //(x, y, width, height)
  if (myRotate == true) { myContext.rotate(-45); } else { }
    }
  </script>
