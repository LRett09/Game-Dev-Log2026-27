<!DOCTYPE html>
<html lang ="en">
<head>
  <meta charset="UTF-8">
  <title>T1A06 Proper and Variables</title>
  <style>
    b { color: blue; }
  </style>
  <script>
    function sayHello() {
      myNum = 3;
      myString = ' Hello ';
      myFloat = 17.5;
      myBool = true;
      myOut = document.getElementById('myDiv01');
      myOut.innerHTML = myNum + myString + myFloat + ', ' + myBool
      if (myBool) {myOut.innerHTML += ', WOW';}
    }
  </script>
</head>

    <button onclick="myBool = false">Make False</button>

<body>
  <p>This is <b>bold</b> text.</p>
  <button onclick="sayHello()">Display Values</button>
  
  <div id="myDiv01">...</div>
</body>
</html>
