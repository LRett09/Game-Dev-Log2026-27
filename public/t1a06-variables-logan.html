<!DOCTYPE html>
<html lang ="en">
<head>
  <meta charset="UTF-8">
  <title>T1A06 Proper and Variables</title>
  <style>
    b { color: blue; }
  </style>
  <script>
      let myNum = 3;
      let myString = ' Hello ';
      let myFloat = 17.5;
      let myBool = true;
    
    function sayHello() {
      myOut = document.getElementById('myDiv01');
      myOut.innerHTML = myNum + myString + myFloat + ', ' + myBool
      if (myBool) {myOut.innerHTML += ', WOW';}
    }
  </script>
</head>

<body>

  <button onclick="myBool = false">Make False</button><br>
  <button onclick="myNum = 10">Make Ten</button><br>
  <button onclick="myString = ' Bye ' ">Make See ya later</button><br>
  <button onclick="myFloat = 13.5">Make 13.5</button><br>
  
  <p>This is <b>bold</b> text.</p>
  <button onclick="sayHello()">Display Values</button>
  
  <div id="myDiv01">...</div>
</body>
</html>
